# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.storage_dir: '%kernel.project_dir%/var/storage'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/Entity/'
            - '../src/Kernel.php'

    App\Infrastructure\Storage\FileStorageInterface:
        alias: App\Infrastructure\Storage\LocalFileStorage

    App\Infrastructure\Storage\LocalFileStorage:
        arguments:
            $baseStoragePath: '%app.storage_dir%'

    App\Application\Service\TokenService:
        arguments:
            $secret: '%env(APP_SECRET)%'
            $accessTokenTtl: 900

    App\Application\Service\TenantContext:
        shared: true

when@test:
    services:
        App\Application\Service\TenantIdentityService:
            public: true
            autowire: true
            autoconfigure: true
        App\Application\Service\TokenService:
            public: true
            autowire: true
            autoconfigure: true
            arguments:
                $secret: '%env(APP_SECRET)%'
                $accessTokenTtl: 900
        App\Application\Service\TenantContext:
            public: true
            shared: true
        App\Application\Service\TenantResolver:
            public: true
            autowire: true
            autoconfigure: true
        App\Application\Service\ExerciseService:
            public: true
            autowire: true
            autoconfigure: true
        App\Application\Service\WorkoutTemplateService:
            public: true
            autowire: true
            autoconfigure: true
        App\Application\Service\StudentWorkoutPlanService:
            public: true
            autowire: true
            autoconfigure: true
        App\Application\Service\WorkoutSessionService:
            public: true
            autowire: true
            autoconfigure: true
        App\Application\Service\AssessmentService:
            public: true
            autowire: true
            autoconfigure: true



