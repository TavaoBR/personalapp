services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    depends_on:
      - api
    networks:
      - personal_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change_this_secret_in_production}
      DATABASE_URL: mysql://${DB_USER:-personal_user}:${DB_PASSWORD:-personal_pass}@mysql:3306/${DB_NAME:-personalapp}?serverVersion=8.0.32&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    volumes:
      - ./api:/var/www/html
      - app_storage:/var/www/html/var/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - personal_network

  messenger-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:-change_this_secret_in_production}
      DATABASE_URL: mysql://${DB_USER:-personal_user}:${DB_PASSWORD:-personal_pass}@mysql:3306/${DB_NAME:-personalapp}?serverVersion=8.0.32&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    volumes:
      - ./api:/var/www/html
      - app_storage:/var/www/html/var/storage
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - personal_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-personalapp}
      MYSQL_USER: ${DB_USER:-personal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-personal_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personal_network

volumes:
  mysql_data:
  app_storage:

networks:
  personal_network:
    driver: bridge
